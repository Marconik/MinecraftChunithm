plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        minecraftchunithm {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            if (project.hasProperty('motionQuickPlay') || project.hasProperty('modelQuickPlay') || project.hasProperty('nameplateQuickPlay')) {
                vmArg project.hasProperty('nameplateQuickPlay') ? '-Dminecraftchunithm.nameplateQuickPlay=true' :
                    project.hasProperty('modelQuickPlay') ? '-Dminecraftchunithm.modelQuickPlay=true' : '-Dminecraftchunithm.motionQuickPlay=true'
                programArg '--quickPlaySingleplayer'
                programArg 'New World'
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def modVersion = project.version.toString()
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
    boundsCheck {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('checkTrackBounds', JavaExec) {
    dependsOn boundsCheckClasses
    classpath = sourceSets.boundsCheck.runtimeClasspath
    mainClass = 'io.github.marconik.minecraftchunithm.TrackBoundsCheck'
}

check.dependsOn checkTrackBounds
