plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    accessWidenerPath = file('src/main/resources/minecraftchunithm.accesswidener')
    splitEnvironmentSourceSets()
    mods {
        minecraftchunithm {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            if (project.hasProperty('audioUiPreview')) {
                runDir 'build/audio-ui-preview'
                vmArg '-Dminecraftchunithm.audioUiPreview=true'
                programArg '--width'
                programArg '1280'
                programArg '--height'
                programArg '800'
            }
            if (project.hasProperty('offTrackQuickPlay')) {
                runDir 'build/air-input-test'
                vmArg '-Dminecraftchunithm.offTrackQuickPlay=true'
                programArg '--quickPlaySingleplayer'
                programArg 'New World'
                programArg '--width'
                programArg '1280'
                programArg '--height'
                programArg '800'
            }
            if (project.hasProperty('uninstallQuickPlay')) {
                runDir 'build/air-input-test'
                vmArg '-Dminecraftchunithm.uninstallQuickPlay=true'
                programArg '--quickPlaySingleplayer'
                programArg 'New World'
            }
            if (project.hasProperty('inputQuickPlay')) {
                // Loom's runDir controls --gameDir as well as the process directory.
                runDir 'build/air-input-test'
                vmArg '-Dminecraftchunithm.inputQuickPlay=true'
                if (project.hasProperty('ultimaQuickPlay')) vmArg '-Dminecraftchunithm.ultimaQuickPlay=true'
                if (project.hasProperty('decorationQuickPlay')) vmArg '-Dminecraftchunithm.decorationQuickPlay=true'
                if (project.hasProperty('theatoreQuickPlay')) vmArg '-Dminecraftchunithm.theatoreQuickPlay=true'
                if (project.hasProperty('noteCueQuickPlay')) vmArg '-Dminecraftchunithm.noteCueQuickPlay=true'
                if (project.hasProperty('reverseQuickPlay')) vmArg '-Dminecraftchunithm.reverseQuickPlay=true'
                if (project.hasProperty('durabilityQuickPlay')) vmArg '-Dminecraftchunithm.durabilityQuickPlay=true'
                if (project.hasProperty('scoreQuickPlay')) vmArg '-Dminecraftchunithm.scoreQuickPlay=true'
                if (project.hasProperty('mineQuickPlay')) vmArg '-Dminecraftchunithm.mineQuickPlay=true'
                if (project.hasProperty('differentialQuickPlay')) vmArg '-Dminecraftchunithm.differentialQuickPlay=true'
                programArg '--quickPlaySingleplayer'
                programArg 'New World'
            }
            if (project.hasProperty('musicUiPreview')) {
                vmArg '-Dminecraftchunithm.musicUiPreview=true'
                programArg '--width'
                programArg '1280'
                programArg '--height'
                programArg '800'
            }
            if (project.hasProperty('playerUiPreview')) {
                runDir 'build/air-input-test'
                vmArg '-Dminecraftchunithm.playerUiPreview=true'
                programArg '--quickPlaySingleplayer'
                programArg 'New World'
                programArg '--width'
                programArg '1280'
                programArg '--height'
                programArg '800'
            }
            if (project.hasProperty('motionQuickPlay') || project.hasProperty('modelQuickPlay') || project.hasProperty('nameplateQuickPlay') || project.hasProperty('connectionQuickPlay')) {
                vmArg project.hasProperty('connectionQuickPlay') ? '-Dminecraftchunithm.connectionQuickPlay=true' :
                    project.hasProperty('nameplateQuickPlay') ? '-Dminecraftchunithm.nameplateQuickPlay=true' :
                    project.hasProperty('modelQuickPlay') ? '-Dminecraftchunithm.modelQuickPlay=true' : '-Dminecraftchunithm.motionQuickPlay=true'
                programArg '--quickPlaySingleplayer'
                programArg 'New World'
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def modVersion = project.version.toString()
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
    boundsCheck {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('checkTrackBounds', JavaExec) {
    dependsOn boundsCheckClasses
    classpath = sourceSets.boundsCheck.runtimeClasspath
    mainClass = 'io.github.marconik.minecraftchunithm.TrackBoundsCheck'
}

check.dependsOn checkTrackBounds

tasks.register('checkDisplayTransport', JavaExec) {
    dependsOn boundsCheckClasses
    classpath = sourceSets.boundsCheck.runtimeClasspath
    mainClass = 'io.github.marconik.minecraftchunithm.DisplayTransportCheck'
}
check.dependsOn checkDisplayTransport

tasks.register('checkAutoScore', JavaExec) {
    dependsOn boundsCheckClasses
    classpath = sourceSets.boundsCheck.runtimeClasspath
    mainClass = 'io.github.marconik.minecraftchunithm.AutoScoreCheck'
}

tasks.register('checkAudioVolume', JavaExec) {
    dependsOn boundsCheckClasses
    classpath = sourceSets.boundsCheck.runtimeClasspath
    mainClass = 'io.github.marconik.minecraftchunithm.AudioVolumeCheck'
}

tasks.register('checkUninstall', JavaExec) {
    dependsOn boundsCheckClasses
    classpath = sourceSets.boundsCheck.runtimeClasspath
    mainClass = 'io.github.marconik.minecraftchunithm.UninstallCheck'
}
